<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Web consumer</title>
  </head>
  <body>
    <main>
      <div id="avatar"></div>
      <output id="status"></output>
      <div class="controls">
        <button type="button" data-state="idle">Idle</button>
        <button type="button" data-state="thinking">Thinking</button>
        <button type="button" data-state="searching">Searching</button>
        <button type="button" data-state="happy">Happy</button>
        <button type="button" data-state="sleeping">Sleeping</button>
        <button type="button" data-gesture="nod">Nod</button>
        <button type="button" data-gesture="spin">Spin</button>
        <button type="button" id="pause">Pause</button>
        <button type="button" id="mute">Mute</button>
        <button type="button" data-look="-0.8,0.3">Look up left</button>
        <button type="button" data-look="0.8,-0.3">Look down right</button>
        <button type="button" data-look="">Look ahead</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
