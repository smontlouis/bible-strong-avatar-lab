name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm check

  swift:
    name: AvatarSwift
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show the Swift toolchain
        run: swift --version

      - name: Test on macOS
        run: swift test

      - name: Build for iOS
        run: xcodebuild build -quiet -scheme AvatarSwift -destination 'generic/platform=iOS Simulator'

      - name: Build the demo app
        run: swift build --package-path examples/avatar-swift-demo
