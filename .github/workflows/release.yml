name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm check

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: 'chore(release): publish runtime packages'
          commit: 'chore(release): publish runtime packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Swift Package Manager installs AvatarSwift from a `vX.Y.Z` tag of this repository: the
      # packages share one version, so each publication gets that tag on the published commit.
      # With no changeset left, the step above published the packages' version (or found it
      # published already). Its `published` output is not used: changesets 3 no longer prints the
      # lines the action reads it from.
      - name: Tag the version for Swift Package Manager
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version="v$(node -p "require('./packages/avatar-core/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "$version already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$version" -m "$version"
            git push origin "$version"
          fi
